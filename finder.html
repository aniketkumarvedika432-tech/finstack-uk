<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find My Tool | FinStack UK</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav-container">
      <a href="index.html" class="logo">FinStack<span>.uk</span></a>
      <nav class="nav-links">
        <a href="tools.html">Directory</a>
        <a href="finder.html" class="active">Find My Tool</a>
        <a href="about.html">About</a>
      </nav>
    </div>
  </header>

  <main class="container page-content">
    <div class="page-header text-center">
      <h1>Find the Right Tool for Your Business</h1>
      <p>Answer three questions to get a tailored shortlist of financial software.</p>
    </div>

    <div class="finder-card">
      <form id="finder-form">
        <div class="form-group">
          <label for="business_type"><strong>1. Business Structure</strong></label>
          <select name="business_type" id="business_type" class="form-control" required>
            <option value="">Select structure...</option>
            <option value="sole-trader">Sole Trader / Freelancer</option>
            <option value="limited-company">Limited Company (LTD)</option>
            <option value="startups">Startup / Scaling Company</option>
          </select>
        </div>

        <div class="form-group">
          <label for="primary_need"><strong>2. Primary Need</strong></label>
          <select name="primary_need" id="primary_need" class="form-control" required>
            <option value="">Select primary need...</option>
            <option value="Accounting">Accounting & Bookkeeping</option>
            <option value="Banking">Business Banking</option>
            <option value="Payments">Card & Online Payments</option>
            <option value="Expenses">Expense & Card Management</option>
            <option value="Payroll">Payroll Management</option>
            <option value="Compliance">Compliance & Tax</option>
          </select>
        </div>

        <div class="form-group">
          <label for="priority"><strong>3. Top Priority</strong></label>
          <select name="priority" id="priority" class="form-control" required>
            <option value="">Select priority...</option>
            <option value="low-cost">Lowest Cost / Free Tier</option>
            <option value="international">International / Multi-currency</option>
            <option value="all-in-one">All-in-One Integration</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Generate My Shortlist</button>
      </form>
    </div>

    <!-- Results Section -->
    <div id="finder-results" style="display: none; margin-top: 40px;">
      <h2 class="text-center" style="margin-bottom: 20px;">Your Tailored Shortlist</h2>
      <div id="shortlist-grid" class="tools-grid"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 FinStack UK. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/tools.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
